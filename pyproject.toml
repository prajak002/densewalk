[project]
name = "densewalk"
version = "0.1.0"
description = "Crowd scene Gaussian modelling -> G1 in simulation"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.13",
    "opencv-python>=4.9",
    "matplotlib>=3.9",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
horizon = [
    "huggingface-hub>=2.0.0",
    "torch>=2.4",
]

[tool.setuptools.packages.find]
where = ["src"]
